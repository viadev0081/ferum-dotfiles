general.import = [
    # "~/.config/alacritty/themes/catppuccin-mocha.toml"
    # "~/.config/alacritty/themes/kanagawa-wave.toml"
    # "~/.config/alacritty/themes/gruvbox.toml"
    # "~/.config/alacritty/themes/everforest.toml"
    # "~/.config/alacritty/themes/noctalia.toml"
]

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#a6adc8"

[font]
size = 10.5

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[window.dimensions]
columns = 82
lines = 26

[window.padding]
x = 4
y = 4

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
opacity = 0.925
blur = true

[keyboard]
